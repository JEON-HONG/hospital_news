<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>병원 경영 뉴스 포털 — 성균관대학교 삼성창원병원</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:        #1428A0;
      --blue-hover:  #1E3FC5;
      --blue-pale:   #EEF1FB;
      --blue-light:  #4A6FD4;
      --gold:        #D97706;
      --gold-pale:   #FEF3C7;
      --gray-bg:     #F5F6FA;
      --gray-border: #E1E4ED;
      --gray-text:   #6B7280;
      --text:        #1A1A2E;
      --shadow:      0 2px 12px rgba(20,40,160,.08);
      --shadow-lg:   0 4px 24px rgba(20,40,160,.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--gray-bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      background: #fff;
      border-bottom: 3px solid var(--blue);
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-img {
      height: 40px;
      object-fit: contain;
      display: block;
    }
    .logo-text {
      display: none;
      flex-direction: column;
      line-height: 1.25;
    }
    .logo-text .univ { font-size: 10px; color: var(--blue); font-weight: 500; letter-spacing: .3px; }
    .logo-text .hosp { font-size: 17px; font-weight: 700; color: var(--text); }
    .hdivider { width: 1px; height: 28px; background: var(--gray-border); }
    .portal-title { font-size: 15px; font-weight: 600; color: var(--blue); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-chip {
      font-size: 12px;
      color: var(--gray-text);
      background: var(--gray-bg);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--gray-border);
      white-space: nowrap;
    }
    /* 오늘의 추천 뉴스 버튼 */
    .recommend-btn {
      background: linear-gradient(135deg, #D97706, #F59E0B);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 16px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(217,119,6,.3);
    }
    .recommend-btn:hover { opacity: .9; transform: translateY(-1px); }
    .recommend-btn.active {
      background: linear-gradient(135deg, #92400E, #D97706);
      box-shadow: 0 2px 12px rgba(217,119,6,.5);
    }
    /* 우리병원 뉴스 버튼 */
    .hospital-btn {
      background: linear-gradient(135deg, #047857, #059669);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 16px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(4,120,87,.3);
    }
    .hospital-btn:hover { opacity: .9; transform: translateY(-1px); }
    .hospital-btn.active { background: linear-gradient(135deg, #064E3B, #047857); }
    /* 다른 병원 둘러보기 버튼 */
    .explore-btn {
      background: linear-gradient(135deg, #4338CA, #6366F1);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 16px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(67,56,202,.3);
    }
    .explore-btn:hover { opacity: .9; transform: translateY(-1px); }

    /* ── Search Bar ──────────────────────────────────────────── */
    .searchbar {
      background: #fff;
      border-bottom: 1px solid var(--gray-border);
      padding: 10px 0;
    }
    .searchbar-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--gray-bg);
      border: 1.5px solid var(--gray-border);
      border-radius: 6px;
      padding: 0 12px;
      gap: 8px;
      transition: border-color .15s, background .15s;
    }
    .search-wrap:focus-within { border-color: var(--blue); background: #fff; }
    .search-icon { color: var(--gray-text); flex-shrink: 0; }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 0;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    .search-input::placeholder { color: var(--gray-text); }
    .search-clear {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-text);
      font-size: 15px;
      padding: 2px 4px;
      display: none;
      border-radius: 3px;
    }
    .search-clear:hover { background: var(--gray-border); }
    .search-clear.on { display: flex; }
    .search-btn {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 22px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .search-btn:hover { background: var(--blue-hover); }
    .source-select {
      border: 1.5px solid var(--gray-border);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      cursor: pointer;
      outline: none;
      min-width: 130px;
    }
    .source-select:focus { border-color: var(--blue); }

    /* ── Tabs ────────────────────────────────────────────────── */
    .tabs {
      background: #fff;
      border-bottom: 1px solid var(--gray-border);
    }
    .tabs-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
    }
    .tab {
      padding: 13px 22px;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-text);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .tab:hover { color: var(--blue); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
    .tab-cnt {
      font-size: 11px;
      font-weight: 700;
      background: var(--blue-pale);
      color: var(--blue);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* ── Main ────────────────────────────────────────────────── */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* mode bar */
    .mode-bar {
      display: none;
      background: var(--blue-pale);
      border: 1px solid #C7D2F0;
      border-radius: 7px;
      padding: 9px 16px;
      font-size: 13px;
      color: var(--blue);
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .mode-bar.on { display: flex; }
    .back-btn {
      background: none;
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 3px 12px;
      font-size: 12px;
      color: var(--blue);
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all .12s;
    }
    .back-btn:hover { background: var(--blue); color: #fff; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      min-height: 22px;
    }
    .status-txt { font-size: 13px; color: var(--gray-text); }
    .status-txt strong { color: var(--blue); }

    /* ── Spinner / Empty ─────────────────────────────────────── */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 0;
      gap: 14px;
    }
    .spinner-wrap.on { display: flex; }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--blue-pale);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-txt { font-size: 13px; color: var(--gray-text); }

    .empty-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 64px 0;
      gap: 10px;
    }
    .empty-wrap.on { display: flex; }
    .empty-icon { font-size: 42px; }
    .empty-msg { font-size: 14px; color: var(--gray-text); }

    /* ── Feed Grid ───────────────────────────────────────────── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 1100px) { .news-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 640px)  { .news-grid { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      cursor: pointer;
      transition: box-shadow .15s, transform .1s, border-color .15s;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: inherit;
    }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: #C7D2F0; }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .cat-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .b-policy { background: #E0F2FE; color: #0369A1; }
    .b-mgmt   { background: #EDE9FE; color: #6D28D9; }
    .b-labor  { background: #FEF3C7; color: #92400E; }
    .b-other  { background: #F3F4F6; color: #6B7280; }
    .src-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-pale);
      padding: 2px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc {
      font-size: 12px;
      color: var(--gray-text);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-date { font-size: 11px; color: var(--gray-text); margin-top: auto; }

    /* ── 오늘의 추천 뉴스 ─────────────────────────────────────── */
    .rec-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .rec-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .rec-header-date {
      font-size: 12px;
      color: var(--gray-text);
      background: var(--gray-bg);
      border: 1px solid var(--gray-border);
      border-radius: 20px;
      padding: 3px 12px;
    }
    .rec-note {
      font-size: 12px;
      color: var(--gray-text);
      margin-left: auto;
    }

    /* 언론사별 추천 섹션 */
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px)  { .rec-grid { grid-template-columns: 1fr; } }

    .rec-section {
      background: #fff;
      border-radius: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-border);
      overflow: hidden;
      transition: box-shadow .15s;
    }
    .rec-section:hover { box-shadow: var(--shadow-lg); }

    .rec-sec-head {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rec-sec-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .rec-sec-cnt {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,.75);
      background: rgba(255,255,255,.15);
      padding: 2px 9px;
      border-radius: 10px;
    }

    .rec-article {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--gray-border);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background .1s;
    }
    .rec-article:last-child { border-bottom: none; }
    .rec-article:hover { background: var(--blue-pale); }

    .rec-rank {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .rank-1 { background: #FEF3C7; color: #92400E; }
    .rank-2 { background: #F3F4F6; color: #374151; }
    .rank-3 { background: #FEE2E2; color: #991B1B; }
    .rank-n { background: var(--blue-pale); color: var(--blue); }

    .rec-body { flex: 1; min-width: 0; }
    .rec-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .rec-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .rec-cat-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .rec-date { font-size: 11px; color: var(--gray-text); }

    .rec-arrow { color: var(--blue); font-size: 16px; margin-top: 2px; flex-shrink: 0; }

    .rec-empty {
      padding: 20px 18px;
      font-size: 13px;
      color: var(--gray-text);
      text-align: center;
    }

    /* ── Search Results ──────────────────────────────────────── */
    .src-section {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      border: 1px solid var(--gray-border);
      overflow: hidden;
    }
    .src-head {
      background: var(--gray-bg);
      padding: 11px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray-border);
    }
    .src-name { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 7px; }
    .res-cnt { font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-pale); padding: 2px 9px; border-radius: 10px; }
    .res-cnt.zero { color: var(--gray-text); background: var(--gray-bg); border: 1px solid var(--gray-border); }
    .result-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--gray-border);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background .1s;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: var(--blue-pale); }
    .res-num { font-size: 12px; font-weight: 700; color: var(--blue); min-width: 22px; text-align: center; margin-top: 2px; flex-shrink: 0; }
    .res-body { flex: 1; min-width: 0; }
    .res-title { font-size: 14px; font-weight: 500; line-height: 1.5; margin-bottom: 3px; }
    .res-title mark { background: #FEF9C3; color: inherit; border-radius: 2px; padding: 0 1px; }
    .res-date { font-size: 11px; color: var(--gray-text); }
    .res-arrow { color: var(--blue); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
    .no-res { padding: 18px 20px; font-size: 13px; color: var(--gray-text); text-align: center; }

    /* ── 더보기 버튼 ─────────────────────────────────────────── */
    .rec-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 11px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--blue);
      text-decoration: none;
      border-top: 1px solid var(--gray-border);
      background: var(--gray-bg);
      transition: background .12s, color .12s;
      gap: 4px;
    }
    .rec-more-btn:hover { background: var(--blue-pale); }
    .rec-rss-fail {
      padding: 18px 20px;
      font-size: 13px;
      color: var(--gray-text);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .rec-rss-fail a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 4px 14px;
      transition: all .12s;
    }
    .rec-rss-fail a:hover { background: var(--blue); color: #fff; }

    /* ── 우리병원 뉴스 섹션 ─────────────────────────────────────── */
    .hosp-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .hosp-header-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .hosp-header-date {
      font-size: 12px; color: var(--gray-text);
      background: var(--gray-bg); border: 1px solid var(--gray-border);
      border-radius: 20px; padding: 3px 12px;
    }
    .hosp-note { font-size: 12px; color: var(--gray-text); margin-left: auto; }
    .hosp-list {
      background: #fff; border-radius: 10px;
      box-shadow: var(--shadow); border: 1px solid var(--gray-border); overflow: hidden;
    }
    .hosp-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 18px; border-bottom: 1px solid var(--gray-border);
      text-decoration: none; color: inherit; transition: background .1s;
    }
    .hosp-item:last-child { border-bottom: none; }
    .hosp-item:hover { background: var(--blue-pale); }
    .hosp-num {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%;
      font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
    }
    .hosp-body { flex: 1; min-width: 0; }
    .hosp-title {
      font-size: 14px; font-weight: 500; line-height: 1.5; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .hosp-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hosp-outlet {
      font-size: 10px; font-weight: 700; color: var(--blue);
      background: var(--blue-pale); border: 1px solid #C7D2F5;
      padding: 1px 6px; border-radius: 2px;
    }
    .hosp-date { font-size: 11px; color: var(--gray-text); }
    .hosp-arrow { color: var(--blue); font-size: 16px; margin-top: 2px; flex-shrink: 0; }
    .hosp-more-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 13px 20px; font-size: 13px; font-weight: 600;
      color: #fff; text-decoration: none;
      background: linear-gradient(135deg, #047857, #059669);
      transition: opacity .12s;
    }
    .hosp-more-btn:hover { opacity: .88; }

    /* ── 모바일 반응형 ──────────────────────────────────────────── */
    @media (max-width: 640px) {

      /* 헤더 — 2행 구조 (로고+제목 / 버튼3개) */
      .header-inner {
        height: auto;
        padding: 10px 12px 0;
        flex-wrap: wrap;
        align-items: center;
      }
      .header-left { gap: 8px; padding-bottom: 8px; }
      .logo-img { height: 24px; }
      .hdivider { display: none; }
      .portal-title { display: block; font-size: 13px; }
      .date-chip { display: none; }
      /* 버튼 3개를 두 번째 행에 독립 둥근 버튼으로 배치 */
      .header-right {
        flex-basis: 100%;
        border-top: 1px solid var(--gray-border);
        gap: 6px;
        padding: 8px 12px;
      }
      .recommend-btn, .hospital-btn, .explore-btn {
        flex: 1;
        justify-content: center;
        border-radius: 8px;
        padding: 8px 4px;
        font-size: 11px;
        gap: 3px;
        box-shadow: none;
        transform: none !important;
      }
      .recommend-btn { border-right: none; }
      .hospital-btn  { border-right: none; }

      /* 검색바 */
      .searchbar { padding: 8px 0; }
      .searchbar-inner { flex-direction: column; padding: 0 12px; gap: 7px; }
      .search-wrap { width: 100%; }
      .source-select { width: 100%; min-width: unset; }
      .search-btn { width: 100%; justify-content: center; padding: 10px; }

      /* 탭 — 가로 스크롤 */
      .tabs-inner {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding: 0 12px;
      }
      .tabs-inner::-webkit-scrollbar { display: none; }
      .tab { padding: 11px 14px; font-size: 12px; }

      /* 메인 */
      .main { padding: 12px; }
      .status-row { margin-bottom: 10px; }

      /* 추천 뉴스 헤더 */
      .rec-header { flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
      .rec-header-title { font-size: 15px; }
      .rec-note { display: none; }
      .rec-header-date { font-size: 11px; }
      /* 우리병원 뉴스 헤더 — 최신 뉴스와 동일 스타일 */
      .hosp-header { flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
      .hosp-header-title { font-size: 15px; }
      .hosp-header-date { font-size: 11px; }

      /* 뉴스 카드 */
      .card { padding: 13px; }
      .card-title { font-size: 13px; }

      /* 추천 기사 */
      .rec-article { padding: 11px 14px; gap: 9px; }
      .rec-title { font-size: 13px; }
      .rec-sec-head { padding: 10px 14px; }

      /* 검색 결과 */
      .result-item { padding: 11px 14px; }
      .res-title { font-size: 13px; }
      .src-head { padding: 9px 14px; }

      /* 모드바 */
      .mode-bar { font-size: 12px; flex-wrap: wrap; gap: 6px; }
    }
  </style>
</head>

  { name: '연합뉴스',     domain: 'yna.co.kr',         home: 'https://www.yna.co.kr/health/index', rss: 'https://www.yna.co.kr/rss/health.xml' },
  { name: '메디파나뉴스', domain: 'medipana.com',       home: 'https://medipana.com',               rss: 'https://medipana.com/article/rss.asp' },
];

const CATS = {
  policy: { label: '의료 정책·제도', cls: 'b-policy', kw: ['건강보험','수가','의료법','복지부','정책','제도','급여','고시','심평원','건보','보험료','본인부담','요양','심사','공단','의료급여','종별'] },
  mgmt:   { label: '병원 경영·재무', cls: 'b-mgmt',   kw: ['경영','수익','원가','적자','흑자','M&A','인수','합병','수익성','재무','경영난','비용','매출','투자','운영','예산','회계','손익'] },
  labor:  { label: '의료 인력·노무', cls: 'b-labor',  kw: ['의사','간호사','전공의','인력','파업','노사','수련','면허','의대','근무환경','간호','의료진','모집','채용','임금','노동','근로'] },
};

// ── State ────────────────────────────────────────────────────────────────
let allArticles    = [];   // 전체 피드 데이터
let recArticles    = {};   // { sourceName: [articles] } 추천 데이터
let hospitalArticles = []; // 우리병원 뉴스 데이터
let activeCat      = 'all';
// 표시 모드: 'recommend' | 'feed' | 'search' | 'hospital'
let viewMode       = 'recommend';

// ── Bootstrap ────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('todayDate').textContent =
    now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  document.getElementById('recDate').textContent =
    now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) + ' 기준';
  document.getElementById('hospDate').textContent =
    now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) + ' 기준';

  document.getElementById('searchInput').addEventListener('input', e => {
    document.getElementById('searchClear').classList.toggle('on', e.target.value.length > 0);
  });

  // 초기 로딩: 추천 뉴스 + 피드 동시에
  loadAllFeeds();
});

// ── Fetch ────────────────────────────────────────────────────────────────
async function fetchRSS(url) {
  const api = `${R2J}?rss_url=${encodeURIComponent(url)}`;
  const res = await fetch(api, { signal: AbortSignal.timeout(12000) });
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.message || 'RSS error');
  return json.items || [];
}

// ── Load All Feeds ────────────────────────────────────────────────────────
async function loadAllFeeds() {
  showSpinner('뉴스를 가져오는 중입니다...');
  allArticles = [];
  recArticles = {};

  // ① news.json 우선 시도 (fetch_news.py 가 생성한 네이버 API 데이터)
  try {
    const res = await fetch('./news.json', {
      cache: 'no-cache',
      signal: AbortSignal.timeout(5000)
    });
    if (!res.ok) throw new Error('news.json 없음');

    const data = await res.json();

    // 24시간 이상 지난 데이터는 RSS 폴백
    if (data.updated) {
      const age = Date.now() - new Date(data.updated.replace(' ', 'T')).getTime();
      if (age > 24 * 60 * 60 * 1000) throw new Error('news.json 오래됨 (24h 초과)');
    }

    allArticles    = data.articles || [];
    hospitalArticles = data.hospital_news || [];

    SOURCES.forEach(src => {
      const items = allArticles.filter(a => a._src === src.name);
      recArticles[src.name] = items.slice(0, 10); // 빈 배열이면 [] 유지
    });

    if (data.updated) {
      const dateLabel = `최종 수집: ${data.updated}`;
      document.getElementById('recDate').textContent  = dateLabel;
      document.getElementById('hospDate').textContent = dateLabel;
    }

    allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    updateCounts();
    hideSpinner();
    showView('recommend');
    return;

  } catch (e) {
    console.info(`news.json 사용 불가 (${e.message}), RSS 폴백`);
  }

  // ② RSS 폴백 (news.json 없거나 오래된 경우)
  const settled = await Promise.allSettled(
    SOURCES.map(src =>
      fetchRSS(src.rss).then(items =>
        items.map(item => ({ ...item, _src: src.name }))
      )
    )
  );

  settled.forEach((r, i) => {
    const name = SOURCES[i].name;
    if (r.status === 'fulfilled') {
      const items = r.value;
      allArticles.push(...items);
      recArticles[name] = items.slice(0, 10);
    } else {
      recArticles[name] = null;
      console.warn(`[${name}] RSS 오류:`, r.reason?.message);
    }
  });

  allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
  updateCounts();
  hideSpinner();
  showView('recommend');
}

// ── View Switcher ─────────────────────────────────────────────────────────
function showView(mode) {
  viewMode = mode;
  document.getElementById('recommendMode').style.display = mode === 'recommend' ? 'block' : 'none';
  document.getElementById('feedMode').style.display      = mode === 'feed'      ? 'block' : 'none';
  document.getElementById('hospitalMode').style.display  = mode === 'hospital'  ? 'block' : 'none';
  document.getElementById('searchMode').style.display    = mode === 'search'    ? 'block' : 'none';

  // 탭/필터 활성화 여부
  const tabsDisabled = (mode === 'search' || mode === 'hospital');
  document.getElementById('tabsRow').style.opacity       = tabsDisabled ? '.4' : '';
  document.getElementById('tabsRow').style.pointerEvents = tabsDisabled ? 'none' : '';
  document.getElementById('sourceFilter').style.display  = tabsDisabled ? 'none' : '';

  // 버튼 active 상태
  document.getElementById('recommendBtn').classList.toggle('active', mode === 'recommend');
  document.getElementById('hospitalBtn').classList.toggle('active', mode === 'hospital');

  if (mode === 'recommend') renderRecommend();
  if (mode === 'feed')      renderFeed();
  if (mode === 'hospital')  renderHospital();
}

// ── 우리병원 뉴스 ─────────────────────────────────────────────────────────
function toggleHospitalMode() {
  showView('hospital');
}

function renderHospital() {
  const list  = document.getElementById('hospList');
  const empty = document.getElementById('emptyHosp');

  // 제목 또는 내용에 '삼성창원병원'이 포함된 기사만 표시
  const filtered = hospitalArticles.filter(item =>
    (item.title       && item.title.includes('삼성창원병원')) ||
    (item.description && item.description.includes('삼성창원병원'))
  );

  if (!filtered.length) {
    list.innerHTML = '';
    empty.classList.add('on');
    document.getElementById('statusTxt').textContent = '우리병원 뉴스 데이터가 없습니다.';
    return;
  }

  empty.classList.remove('on');
  document.getElementById('statusTxt').innerHTML =
    `삼성창원병원 관련 <strong>${filtered.length}건</strong>`;

  const NAVER_URL = 'https://search.naver.com/search.naver?where=news&query=%EC%82%BC%EC%84%B1%EC%B0%BD%EC%9B%90%EB%B3%91%EC%9B%90&sort=1';

  list.innerHTML = `
    <div class="hosp-list">
      ${filtered.map((item, idx) => {
        const rankCls = ['rank-1','rank-2','rank-3'][idx] || 'rank-n';
        return `
        <a class="hosp-item" href="${esc(item.link)}" target="_blank" rel="noopener">
          <span class="hosp-num ${rankCls}">${idx + 1}</span>
          <div class="hosp-body">
            <div class="hosp-title">${h(item.title)}</div>
            <div class="hosp-meta">
              ${item._outlet ? `<span class="hosp-outlet">${h(item._outlet)}</span>` : ''}
              <span class="hosp-date">${fmtDate(item.pubDate)}</span>
            </div>
          </div>
          <span class="hosp-arrow">›</span>
        </a>`;
      }).join('')}
      <a class="hosp-more-btn" href="${NAVER_URL}" target="_blank" rel="noopener">
        네이버뉴스에서 더보기 ›
      </a>
    </div>`;
}

// ── Recommend Mode ────────────────────────────────────────────────────────
function toggleRecommendMode() {
  showView('recommend');
}

function renderRecommend() {
  const grid  = document.getElementById('recGrid');
  const empty = document.getElementById('emptyRec');

  const hasAny = SOURCES.some(s => Array.isArray(recArticles[s.name]) && recArticles[s.name].length > 0);
  if (!hasAny) {
    grid.innerHTML = '';
    empty.classList.add('on');
    document.getElementById('statusTxt').textContent = '뉴스 데이터를 불러오지 못했습니다.';
    return;
  }

  empty.classList.remove('on');
  const totalCount = SOURCES.reduce((acc, s) => acc + (Array.isArray(recArticles[s.name]) ? recArticles[s.name].length : 0), 0);
  document.getElementById('statusTxt').innerHTML =
    `6개 언론사 총 <strong>${totalCount}건</strong>의 최신 기사`;

  grid.innerHTML = SOURCES.map(src => {
    const items = recArticles[src.name]; // null = 실패, [] = 성공 but 빈값, [...] = 정상

    if (items === null) {
      return `
        <div class="rec-section">
          <div class="rec-sec-head">
            <span class="rec-sec-name">📰 ${h(src.name)}</span>
            <span class="rec-sec-cnt zero">로딩 실패</span>
          </div>
          <div class="rec-rss-fail">
            <span>RSS를 불러오지 못했습니다.</span>
            <a href="${esc(src.home)}" target="_blank" rel="noopener">홈페이지 바로가기 ›</a>
          </div>
        </div>`;
    }

    const rows = items.length
      ? items.map((item, idx) => {
          const cat = classify(item);
          const catInfo = CATS[cat] || { label: '기타', cls: 'b-other' };
          const rankCls = ['rank-1','rank-2','rank-3'][idx] || 'rank-n';
          return `
            <a class="rec-article" href="${esc(item.link)}" target="_blank" rel="noopener">
              <span class="rec-rank ${rankCls}">${idx + 1}</span>
              <div class="rec-body">
                <div class="rec-title">${h(item.title)}</div>
                <div class="rec-meta">
                  <span class="rec-cat-badge ${catInfo.cls}">${catInfo.label}</span>
                  <span class="rec-date">${fmtDate(item.pubDate)}</span>
                </div>
              </div>
              <span class="rec-arrow">›</span>
            </a>`;
        }).join('')
      : `<div class="rec-empty">최신 기사가 없습니다.</div>`;

    return `
      <div class="rec-section">
        <div class="rec-sec-head">
          <span class="rec-sec-name">📰 ${h(src.name)}</span>
          <span class="rec-sec-cnt">${items.length}건</span>
        </div>
        ${rows}
        <a class="rec-more-btn" href="${esc(src.home)}" target="_blank" rel="noopener">
          더보기 ›
        </a>
      </div>`;
  }).join('');
}

// ── Feed Mode ─────────────────────────────────────────────────────────────
function classify(article) {
  const txt = ((article.title||'') + ' ' + (article.description||'')).toLowerCase();
  for (const [key, cat] of Object.entries(CATS)) {
    if (cat.kw.some(kw => txt.includes(kw))) return key;
  }
  return 'other';
}

function updateCounts() {
  const cnt = { all: allArticles.length, policy: 0, mgmt: 0, labor: 0 };
  allArticles.forEach(a => { const c = classify(a); if (c in cnt) cnt[c]++; });
  Object.entries(cnt).forEach(([k, v]) => {
    const el = document.getElementById('cnt-' + k);
    if (el) el.textContent = v;
  });
}

function renderFeed() {
  if (viewMode !== 'feed') return;
  const srcFilter = document.getElementById('sourceFilter').value;
  let arts = allArticles;
  if (activeCat !== 'all') arts = arts.filter(a => classify(a) === activeCat);
  if (srcFilter)           arts = arts.filter(a => a._src === srcFilter);

  const grid  = document.getElementById('newsGrid');
  const empty = document.getElementById('emptyFeed');

  if (!arts.length) {
    grid.innerHTML = '';
    empty.classList.add('on');
    document.getElementById('statusTxt').textContent = '표시할 뉴스가 없습니다.';
    return;
  }
  empty.classList.remove('on');
  document.getElementById('statusTxt').innerHTML =
    `총 <strong>${allArticles.length}건</strong> 중 <strong>${arts.length}건</strong> 표시`;

  grid.innerHTML = arts.map(a => {
    const cat     = classify(a);
    const catInfo = CATS[cat] || { label: '기타', cls: 'b-other' };
    const desc    = strip(a.description || a.content || '').slice(0, 100);
    return `
      <a class="card" href="${esc(a.link)}" target="_blank" rel="noopener">
        <div class="card-top">
          <span class="cat-badge ${catInfo.cls}">${catInfo.label}</span>
          <span class="src-badge">${h(a._src)}</span>
        </div>
        <div class="card-title">${h(a.title)}</div>
        ${desc ? `<div class="card-desc">${h(desc)}…</div>` : ''}
        <div class="card-date">${fmtDate(a.pubDate)}</div>
      </a>`;
  }).join('');
}

function onSourceChange() {
  if (viewMode === 'feed') renderFeed();
}

// ── Tabs ──────────────────────────────────────────────────────────────────
function setTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  activeCat = el.dataset.cat;
  if (viewMode !== 'feed') showView('feed');
  else renderFeed();
}

// ── Search ────────────────────────────────────────────────────────────────
async function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) { clearSearch(); return; }

  showView('search');
  document.getElementById('modeBar').classList.add('on');
  document.getElementById('modeTxt').innerHTML = `"<strong>${h(kw)}</strong>"&nbsp; 언론사별 검색 결과`;
  showSpinner(`6개 언론사에서 "${kw}" 검색 중...`);

  const GN = 'https://news.google.com/rss/search';
  const settled = await Promise.allSettled(
    SOURCES.map(src => {
      const url = `${GN}?q=${encodeURIComponent(kw + ' site:' + src.domain)}&hl=ko&gl=KR&ceid=KR:ko`;
      return fetchRSS(url).then(items => ({ src, items }));
    })
  );

  hideSpinner();

  let totalFound = 0;
  const sections = document.getElementById('searchSections');
  sections.innerHTML = settled.map((r, i) => {
    const src   = SOURCES[i];
    const items = r.status === 'fulfilled'
      ? r.value.items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate))
      : [];
    totalFound += items.length;

    const rows = items.length
      ? items.map((item, idx) => `
          <a class="result-item" href="${esc(item.link)}" target="_blank" rel="noopener">
            <span class="res-num">${idx + 1}</span>
            <div class="res-body">
              <div class="res-title">${highlight(h(item.title), kw)}</div>
              <div class="res-date">${fmtDate(item.pubDate)}</div>
            </div>
            <span class="res-arrow">›</span>
          </a>`).join('')
      : `<div class="no-res">관련 기사를 찾지 못했습니다.</div>`;

    return `
      <div class="src-section">
        <div class="src-head">
          <span class="src-name">📰 ${h(src.name)}</span>
          <span class="res-cnt ${items.length ? '' : 'zero'}">${items.length}건</span>
        </div>
        ${rows}
      </div>`;
  }).join('');

  document.getElementById('emptySearch').classList.toggle('on', totalFound === 0);
  document.getElementById('statusTxt').innerHTML =
    `"<strong>${h(kw)}</strong>" 검색 결과 — 총 <strong>${totalFound}건</strong>`;
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('on');
  document.getElementById('modeBar').classList.remove('on');
  document.getElementById('emptySearch').classList.remove('on');
  document.getElementById('searchSections').innerHTML = '';
  showView('recommend');
}

// ── UI Helpers ────────────────────────────────────────────────────────────
function showSpinner(msg) {
  document.getElementById('spinnerTxt').textContent = msg || '불러오는 중...';
  document.getElementById('spinnerWrap').classList.add('on');
  document.getElementById('statusTxt').textContent = '';
}
function hideSpinner() { document.getElementById('spinnerWrap').classList.remove('on'); }


function fmtDate(d) {
  if (!d) return '';
  try {
    return new Date(d).toLocaleDateString('ko-KR',
      { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch { return d; }
}
function strip(html) {
  return html.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
}
function h(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function highlight(html, kw) {
  if (!kw) return html;
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return html.replace(re, '<mark>$1</mark>');
}
